<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/styles.css?v=2" />
    <title>Weather</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Weather</h1>
        <p class="subtitle">Search any city to get current weather</p>
      </header>

      <form id="searchForm" class="search-form" aria-label="Search city">
        <input
          id="city"
          class="search-input"
          placeholder="City name (e.g. Lagos)"
          required
        />
        <button type="submit" class="search-btn">Search</button>
      </form>

      <section id="result" class="result" aria-live="polite"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
